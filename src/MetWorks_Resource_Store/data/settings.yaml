definitions:
  - path: /services/instance/installationId
    defaultValue: ""
    description: "Per-installation stable identifier (GUID). Generated on first run and persisted locally."
    expectedValueType: "String"
    allowableValues: []
    isEditable: false
    isSecret: false

  - path: /services/loggerFile/fileSizeLimitBytes
    defaultValue: "10485760"
    description: "File size limit in bytes"
    expectedValueType: "Int32"
    allowableValues: []
    isSecret: false

  - path: /services/loggerFile/minimumLevel
    defaultValue: "Warning"
    description: "Minimum log level"
    expectedValueType: "String"
    allowableValues:
      - "Verbose"
      - "Debug"
      - "Information"
      - "Warning"
      - "Error"
      - "Fatal"
    isSecret: false

  - path: /services/loggerFile/outputTemplate
    defaultValue: "[InstallationId: {InstallationId}{Timestamp:yyyy-MM-dd HH:mm:ss} {Level:u3}] {Message:lj}{NewLine}{Exception}"
    description: "Serilog output template"
    expectedValueType: "String"
    allowableValues: []
    isSecret: false

  - path: /services/loggerFile/relativeLogPath
    defaultValue: "Logs/log-.txt"
    description: "File path for log files"
    expectedValueType: "String"
    allowableValues: []
    isSecret: false

  - path: /services/loggerFile/retainedFileCountLimit
    defaultValue: "7"
    description: "Retained file count limit"
    expectedValueType: "Int32"
    allowableValues: []
    isSecret: false

  - path: /services/loggerFile/rollOnFileSizeLimit
    defaultValue: "true"
    description: "Roll on file size limit"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isSecret: false

  - path: /services/loggerFile/rollingInterval
    defaultValue: "Day"
    description: "Rolling Interval"
    expectedValueType: "String"
    allowableValues:
      - "Infinite"
      - "Year"
      - "Month"
      - "Day"
      - "Hour"
      - "Minute"
    isSecret: false

  - path: /services/loggerSQLite/minimumLevel
    defaultValue: "Error"
    description: "Minimum log level for SQLite logging"
    expectedValueType: "String"
    allowableValues:
      - "Verbose"
      - "Debug"
      - "Information"
      - "Warning"
      - "Error"
      - "Fatal"
    isSecret: false

  - path: /services/metrics/applicationId
    defaultValue: "00000000-0000-0000-0000-000000000000"
    description: "Stable application identifier (GUID) used for metrics correlation across app renames"
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/autoCreateTable
    defaultValue: "true"
    description: "Auto create table for metrics summaries"
    expectedValueType: "Boolean"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/captureIntervalSeconds
    defaultValue: "10"
    description: "Metrics collection interval in seconds"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/enabled
    defaultValue: "true"
    description: "Enable metrics collection and persistence (intended for wall-device tuning; typically off for field deployments)"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/metrics/pipelineEnabled
    defaultValue: "true"
    description: "Enable provenance-based pipeline timing summaries for weather readings (UDP→transform and transform durations)"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/metrics/pipelineTopN
    defaultValue: "10"
    description: "Number of top reading types to include in periodic pipeline summary"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/relayEnabled
    defaultValue: "true"
    description: "Enable EventRelayBasic handler timing aggregation"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/metrics/relayTopN
    defaultValue: "10"
    description: "Number of top (message_type, recipient_type) handler pairs to include in periodic relay metrics summary"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/shippingEnabled
    defaultValue: "true"
    description: "Include local-first stream shipping upload/state summaries in the periodic METRICS payload"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/metrics/shippingTopN
    defaultValue: "10"
    description: "Number of top (source, table) upload hotspots to include in periodic stream shipping metrics summary"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/storageEnabled
    defaultValue: "true"
    description: "Capture local storage consumption metrics (settings overrides, log file, logging sqlite, readings sqlite)"
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/metrics/storageTopN
    defaultValue: "10"
    description: "Maximum number of largest log files (by size) to include under the log file sink directory"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/metrics/tableName
    defaultValue: "metrics_summary"
    description: "Table name for metrics summaries"
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/sqlite/busyTimeoutMs
    defaultValue: "5000"
    description: "SQLite busy_timeout in milliseconds for write operations"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/sqlite/connectionString
    defaultValue: ""
    description: "SQLite connection string (leave blank to use dbPath + default connection string builder)."
    expectedValueType: "String"
    allowableValues:
    isEditable: true
    isSecret: true

  - path: /services/sqlite/dbPath
    defaultValue: "metworks.sqlite"
    description: "SQLite database file path (relative paths are relative to the app's data directory)."
    expectedValueType: "String"
    allowableValues:
    isEditable: true
    isSecret: false

  - path: /services/sqlite/journalMode
    defaultValue: "WAL"
    description: "SQLite journal_mode (e.g., WAL, DELETE)"
    expectedValueType: "String"
    allowableValues:
      - "WAL"
      - "DELETE"
      - "TRUNCATE"
      - "PERSIST"
      - "MEMORY"
      - "OFF"
    isEditable: true
    isSecret: false

  - path: /services/streamShipping/enabled
    defaultValue: "true"
    description: "Enable local-first stream shipping of SQLite-persisted data via NDJSON-over-HTTP."
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/streamShipping/endpointUrl
    defaultValue: "http://192.168.8.9:5157/ingest/v1/stream"
    description: "Stream shipping ingestion endpoint URL (e.g., https://example.com/ingest/v1/stream)."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: true

  - path: /services/streamShipping/maxBatchRows
    defaultValue: "500"
    description: "Maximum number of rows to ship per batch."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/streamShipping/shipIntervalSeconds
    defaultValue: "45"
    description: "How often to attempt shipping (seconds)."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/streamShippingHttp/timeoutSeconds
    defaultValue: "15"
    description: "HTTP timeout (seconds) for stream shipping uploads."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/streamShippingHttp/allowInvalidTlsForEndpointHost
    defaultValue: ""
    description: "Host for which to allow invalid TLS certificates when shipping streams over HTTPS (only applicable in DEBUG mode)."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/apiKey
    defaultValue: "c83c3cb2-a6d2-4c6f-b2f4-56aa9ab7306e"
    description: "API Key for Tempest Weather Station"
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: true

  - path: /services/tempest/oauth/clientId
    defaultValue: ""
    description: "OAuth Client ID for Tempest developer application (required for WebSocket API)."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/oauth/authorizeUrl
    defaultValue: "https://smartweather.weatherflow.com/authorize.html"
    description: "OAuth authorization endpoint URL for Tempest."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/oauth/redirectUri
    defaultValue: "metworks-weatherstation://oauth2redirect"
    description: "OAuth redirect URI for Tempest developer application (must match the callback registered with Tempest)."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/oauth/tokenUrl
    defaultValue: "https://swd.weatherflow.com/id/oauth2/token"
    description: "OAuth token endpoint URL for Tempest."
    expectedValueType: "String"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/stationId
    defaultValue: "160805"
    description: "Station ID for Tempest Weather Station"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/websocket/deviceId
    defaultValue: "0"
    description: "Tempest device_id to subscribe to for WebSocket obs_st / rapid_wind. Use 0 to auto-discover from the station snapshot when possible."
    expectedValueType: "Int64"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempest/websocket/enabled
    defaultValue: "false"
    description: "Enable Tempest WebSocket ingest (cloud-hosted real-time stream)."
    expectedValueType: "Boolean"
    allowableValues:
      - true
      - false
    isEditable: true
    isSecret: false

  - path: /services/tempestForecast/refreshIntervalMinutes
    defaultValue: "60"
    description: "How often to refresh Better Forecast over REST (minutes)."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/tempestObservations/refreshIntervalMinutes
    defaultValue: "15"
    description: "How often to refresh station observations over REST (minutes)."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/udpListener/udpListenerPort
    defaultValue: "50222"
    description: "UDP Port for listening for readings from Tempest Weather Station"
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/unitOfMeasure/airPressure
    defaultValue: "inch of mercury"
    description: "Unit that air pressure is provided in"
    expectedValueType: "String"
    allowableValues:
      - "atmosphere"
      - "bar"
      - "hectopascal"
      - "inch of mercury"
      - "kilopascal"
      - "millibar"
      - "pascal"
    isEditable: true
    isSecret: false

  - path: /services/unitOfMeasure/airTemperature
    defaultValue: "degree fahrenheit"
    description: "Unit that air temperature is provided in"
    expectedValueType: "String"
    allowableValues:
      - "degree fahrenheit"
      - "degree celsius"
    isEditable: true
    isSecret: false

  - path: /services/unitOfMeasure/batteryLevel
    defaultValue: "volt"
    description: "Unit that battery level is provided in"
    expectedValueType: "String"
    allowableValues:
      - "volt"
    isEditable: false
    isSecret: false

  - path: /services/unitOfMeasure/illuminance
    defaultValue: "lux"
    description: "Unit that illuminance is provided in"
    expectedValueType: "String"
    allowableValues:
      - "lux"
      - "candela"
    isEditable: false
    isSecret: false

  - path: /services/unitOfMeasure/lightningDistance
    defaultValue: "mile"
    description: "Unit that lightning distance is provided in"
    expectedValueType: "String"
    allowableValues:
      - "kilometer"
      - "meter"
      - "mile"
      - "nautical mile"
    isEditable: true
    isSecret: false

  - path: /services/unitOfMeasure/rainAccumulation
    defaultValue: "inch"
    description: "Unit that the amount of rain accumulation is provided in"
    expectedValueType: "String"
    allowableValues:
      - "centimeter"
      - "millimeter"
      - "inch"
    isSecret: false

  - path: /services/unitOfMeasure/solarRadiation
    defaultValue: "watt/square meter"
    description: "Unit that lightning distance is provided in"
    expectedValueType: "String"
    allowableValues:
      - "watt/square meter"
      - "kilowatt/square meter"
    isSecret: false

  - path: /services/unitOfMeasure/windSpeed
    defaultValue: "mile/hour"
    description: "Unit that lightning distance is provided in"
    expectedValueType: "String"
    allowableValues:
      - "kilometer/hour"
      - "knot"
      - "meter/second"
      - "mile/hour"
    isSecret: false

  - path: /services/weatherIngest/restStaleMinutes
    defaultValue: "20"
    description: "How old the last successful REST observations fetch can be before REST is considered stale/unavailable (minutes)."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false

  - path: /services/weatherIngest/sourceMode
    defaultValue: "Auto"
    description: "Weather ingest source selection mode. Auto prefers UDP when fresh, falls back to REST when UDP is stale."
    expectedValueType: "String"
    allowableValues:
      - "Auto"
      - "RestOnly"
      - "UdpOnly"
    isEditable: true
    isSecret: false

  - path: /services/weatherIngest/udpStaleSeconds
    defaultValue: "90"
    description: "How old the last received UDP reading can be before UDP is considered stale/unavailable (seconds)."
    expectedValueType: "Int32"
    allowableValues: []
    isEditable: true
    isSecret: false
